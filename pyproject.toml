[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skelantic"
version = "0.1.0"
description = "A declarative repository governance and automation framework using skeletal templates and Pydantic."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dr. Georg Hackenberg", email = "georg.hackenberg@fh-ooe.at" }]
dependencies = [
    "PyYAML>=6.0.2",
    "pydantic>=2.0.0",
    "markdown-it-py>=3.0.0",
    "mdit-py-plugins>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pyright>=1.1.350"
]

[project.scripts]
skelantic = "skelantic.cli:main"

[tool.pyright]
include = ['src/skelantic', 'tasks.py']
exclude = ['**/__pycache__', '**/.pytest_cache']
typeCheckingMode = 'strict'
