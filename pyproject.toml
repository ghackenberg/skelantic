[build-system]
requires = ["hatchling", "hatch-vcs", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[project]
name = "skelantic"
dynamic = ["version", "readme"]
description = "A declarative repository governance and automation framework using skeletal templates and Pydantic."
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Dr. Georg Hackenberg", email = "georg.hackenberg@fh-ooe.at" }]
dependencies = [
    "PyYAML>=6.0.2",
    "pydantic>=2.0.0",
    "markdown-it-py>=3.0.0",
    "mdit-py-plugins>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pyright>=1.1.350"
]

[project.scripts]
skelantic = "skelantic.cli:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
# Replaces all relative links (that don't start with http://, https://, or #) with absolute GitHub URLs
pattern = '\]\(((?!https?://|#)[^)]+)\)'
replacement = '](https://github.com/ghackenberg/skelantic/blob/main/\1)'

[tool.pyright]
include = ['src/skelantic', 'tasks.py']
exclude = ['**/__pycache__', '**/.pytest_cache']
typeCheckingMode = 'strict'
